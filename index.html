<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5,user-scalable=yes">
<title>PCJ Catalogue</title>
<link rel="stylesheet" href="./stPageFlip.min.css">
<script src="./page-flip.browser.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
:root{
  --gold:#c9a96e;
  --gold-text:#9a7b3e;
  --bg:#ece6db;
  --lift:0;
}
html,body{
  width:100%;height:100%;overflow:hidden;
  background:var(--bg);
  background:radial-gradient(ellipse 120% 80% at 50% 18%,#faf7f1 0%,#ece6db 58%,#e2dbcd 100%);
  font-family:'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;
  user-select:none;
}

/* HEADER */
#hdr{
  position:fixed;top:0;left:0;right:0;height:38px;z-index:100;
  display:flex;align-items:center;justify-content:space-between;
  padding:0 22px;
  background:rgba(255,255,255,.55);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(160,130,80,.22);
}
.hl{color:var(--gold-text);font-size:11px;letter-spacing:.25em;}
.hr{color:rgba(60,50,35,.5);font-size:11px;letter-spacing:.12em;}

/* SCENE */
#scene{
  position:fixed;top:38px;bottom:46px;left:0;right:0;
  display:flex;align-items:center;justify-content:center;
  perspective:2800px;
  perspective-origin:50% 42%;
}
#zoom-wrap{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  transform-origin:center center;
  transition:transform .12s ease;
  z-index:2;
}
html.single-page-mode #zoom-wrap{touch-action:none;}
html.zoomed #zoom-wrap{transition:none;}
html.zoomed #book{pointer-events:none;}
#scene::before{
  content:'';
  position:absolute;inset:0;
  pointer-events:none;
  background:
    radial-gradient(ellipse 54% 36% at 50% 6%,rgba(255,251,240,.6),transparent 64%),
    radial-gradient(ellipse 92% 70% at 50% 98%,rgba(120,104,78,.16),transparent 72%);
  opacity:.9;
}

/* TABLE shadow under book — hidden on the light background (the 3D-rotated
   rectangle showed up as a gray angled sheet). The book's own drop-shadow
   grounds it instead. */
#book-shadow{
  display:none!important;
}

/* BOOK */
#book{
  position:relative;
  display:flex;
  transform-style:preserve-3d;
  z-index:2;
  transform:rotateX(1.2deg);
  filter:drop-shadow(0 18px 26px rgba(0,0,0,.48));
}

/* PAGE HALVES */
.ph{
  position:relative;
  overflow:hidden;
  flex-shrink:0;
  background:#fff;
  transform-style:preserve-3d;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);
}
#lp{border-radius:3px 0 0 3px;}
#rp{border-radius:0 3px 3px 0;}

.ph img{display:block;width:100%;height:100%;object-fit:cover;}
.ph::after{
  content:'';
  position:absolute;top:0;bottom:0;width:18px;z-index:4;pointer-events:none;
  opacity:.58;
}
#lp::after{right:0;background:linear-gradient(to left,rgba(0,0,0,.24),rgba(0,0,0,.06) 42%,transparent);}
#rp::after{left:0;background:linear-gradient(to right,rgba(0,0,0,.24),rgba(0,0,0,.06) 42%,transparent);}

/* Gradient overlays on static pages */
.ph-shade{
  position:absolute;inset:0;
  pointer-events:none;
  opacity:0;
  z-index:3;
}
/* Left page shade: dark at right (spine), fades left */
#lp-shade{background:linear-gradient(to left, rgba(0,0,0,.55) 0%, transparent 65%);}
/* Right page shade: dark at left (spine), fades right */
#rp-shade{background:linear-gradient(to right, rgba(0,0,0,.55) 0%, transparent 65%);}

/* SPINE */
#spine{
  position:absolute;top:0;bottom:0;
  width:34px;
  left:50%;transform:translateX(-50%);
  z-index:10;pointer-events:none;
  background:
    radial-gradient(ellipse 80% 100% at 50% 50%,rgba(0,0,0,.34),rgba(0,0,0,.16) 34%,transparent 72%),
    linear-gradient(to right,transparent,rgba(255,255,255,.12) 47%,rgba(0,0,0,.2) 53%,transparent);
  filter:blur(1.8px);
  opacity:.78;
}
#spine::before{
  content:'';
  position:absolute;top:0;bottom:0;left:50%;width:2px;transform:translateX(-50%);
  background:linear-gradient(to bottom,transparent,rgba(0,0,0,.18) 12%,rgba(0,0,0,.22) 88%,transparent);
  opacity:.55;
}

/* Page edge shadows (top/bottom of book) */
#book::before,#book::after{
  content:'';
  position:absolute;left:4px;right:4px;height:14px;z-index:6;pointer-events:none;
}
#book::before{top:0;background:linear-gradient(to bottom,rgba(0,0,0,.12),transparent 70%);}
#book::after{
  bottom:-9px;height:18px;
  background:
    repeating-linear-gradient(to bottom,rgba(236,236,222,.72) 0 1px,rgba(170,170,156,.42) 1px 2px,transparent 2px 4px),
    linear-gradient(to bottom,rgba(255,255,255,.2),rgba(0,0,0,.2));
  transform:skewX(-1deg);
  opacity:.7;
}
#book.front-cover::after{left:50%;}
#book.back-cover::after{right:50%;}
#book.back-cover #page-stack{display:none;}

/* Paper thickness visible on the right and bottom, like a real stack */
#page-stack{
  position:absolute;right:-11px;top:4px;bottom:-7px;width:16px;
  z-index:0;pointer-events:none;border-radius:0 4px 4px 0;
  background:
    repeating-linear-gradient(to right,rgba(248,248,235,.96) 0 2px,rgba(185,185,170,.6) 2px 3px,rgba(230,230,216,.9) 3px 5px),
    linear-gradient(to right,rgba(255,255,255,.8),rgba(0,0,0,.18));
  box-shadow:8px 8px 14px rgba(0,0,0,.28);
  transform:skewY(.8deg);
}

/* FLIPPER */
#flipper{
  position:absolute;
  top:0;bottom:0;
  transform-style:preserve-3d;
  z-index:20;
  display:none;
  will-change:transform,filter;
  filter:drop-shadow(calc(var(--lift) * 18px) 18px calc(18px + var(--lift) * 26px) rgba(0,0,0,.55));
}
#flipper::before{
  content:'';
  position:absolute;top:0;bottom:0;width:7px;z-index:30;pointer-events:none;
  background:linear-gradient(to right,rgba(255,255,255,.55),rgba(214,214,202,.34),rgba(0,0,0,.18));
  opacity:calc(.2 + var(--lift) * .72);
}
#book[data-dir="1"] #flipper::before{right:-4px;}
#book[data-dir="-1"] #flipper::before{left:-4px;transform:scaleX(-1);}
.ff{
  position:absolute;inset:0;
  backface-visibility:hidden;
  overflow:hidden;
  background:#fff;
  border-radius:2px;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.06);
}
.ff img{display:block;width:100%;height:100%;object-fit:cover;}
#ff-back{transform:rotateY(180deg);}

/* Gradient overlays on flipper faces */
.ff-shade{
  position:absolute;inset:0;pointer-events:none;z-index:5;opacity:0;
}
/* Forward flip: front face — dark at spine (left edge), highlight at outer */
#ffs-shade{background:linear-gradient(to right,rgba(0,0,0,.75) 0%,rgba(0,0,0,.05) 100%);}
/* Forward flip: back face — dark at outer edge (right), bright at spine */
#ffb-shade{background:linear-gradient(to left,rgba(0,0,0,.6) 0%,rgba(0,0,0,.05) 100%);}

/* Page edge gloss on flipper */
.ff::after{
  content:'';position:absolute;inset:0;pointer-events:none;z-index:4;
  background:
    linear-gradient(105deg,rgba(255,255,255,.28) 0%,rgba(255,255,255,.05) 26%,transparent 54%),
    radial-gradient(ellipse 48% 28% at 94% 4%,rgba(255,255,255,.36),transparent 68%);
  opacity:calc(.35 + var(--lift) * .55);
}

/* Turning cast shadow across the spread */
#turn-shadow{
  position:absolute;top:0;bottom:0;width:40%;
  z-index:19;pointer-events:none;display:none;opacity:0;
  background:
    linear-gradient(to right,transparent,rgba(0,0,0,.48) 45%,rgba(0,0,0,.26),transparent),
    radial-gradient(ellipse at center,rgba(0,0,0,.38),transparent 64%);
  mix-blend-mode:multiply;
  filter:blur(10px);
}

.corner-hit{
  position:absolute;bottom:0;width:86px;height:86px;z-index:18;
  opacity:0;transition:opacity .18s ease,transform .18s ease;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.28));
  cursor:pointer;
}
.corner-hit::before{
  content:'';
  position:absolute;inset:0;
  background:
    radial-gradient(ellipse 120% 76% at 88% 86%,rgba(255,255,255,.98),rgba(244,244,232,.92) 34%,rgba(213,213,198,.78) 58%,rgba(139,139,126,.2) 74%,transparent 76%),
    linear-gradient(315deg,rgba(255,255,255,.95),rgba(224,224,209,.82) 52%,rgba(145,145,130,.16) 64%,transparent 66%);
  border-radius:0 0 0 18px;
}
.corner-hit::after{
  content:'';
  position:absolute;right:4px;bottom:21px;width:92px;height:16px;
  background:linear-gradient(to right,transparent,rgba(0,0,0,.38),rgba(0,0,0,.08),transparent);
  transform:rotate(-42deg);
  transform-origin:100% 50%;
  filter:blur(3px);
  opacity:.72;
}
#corner-next{
  right:0;
  clip-path:polygon(100% 100%,100% 0,0 100%);
  clip-path:path("M 86 86 L 86 10 C 76 38 48 70 0 86 Z");
  transform-origin:100% 100%;animation:curlBreatheR 2.3s ease-in-out infinite;
}
#corner-prev{
  left:0;
  clip-path:polygon(0 100%,100% 100%,0 0);
  clip-path:path("M 0 86 L 0 10 C 10 38 38 70 86 86 Z");
  transform-origin:0 100%;animation:curlBreatheL 2.3s ease-in-out infinite;
}
#corner-prev::before{
  background:
    radial-gradient(ellipse 120% 76% at 12% 86%,rgba(255,255,255,.98),rgba(244,244,232,.92) 34%,rgba(213,213,198,.78) 58%,rgba(139,139,126,.2) 74%,transparent 76%),
    linear-gradient(45deg,rgba(255,255,255,.95),rgba(224,224,209,.82) 52%,rgba(145,145,130,.16) 64%,transparent 66%);
  border-radius:0 0 18px 0;
}
#corner-prev::after{
  left:4px;right:auto;
  transform:rotate(42deg);
  transform-origin:0 50%;
}
.corner-hit.off{opacity:0;pointer-events:none;}
.corner-hit:not(.off):hover{opacity:.92;transform:translateY(-2px);}
@keyframes curlBreatheR{
  0%,100%{transform:rotateY(0deg) rotateZ(0deg);}
  45%{transform:rotateY(-20deg) rotateZ(3deg) translateY(-2px);}
}
@keyframes curlBreatheL{
  0%,100%{transform:rotateY(0deg) rotateZ(0deg);}
  45%{transform:rotateY(20deg) rotateZ(-3deg) translateY(-2px);}
}

/* More obvious lifted paper corner during the page turn */
#fold-curl{
  position:absolute;bottom:0;width:86px;height:86px;z-index:9;pointer-events:none;opacity:0;
  background:
    radial-gradient(ellipse 125% 78% at 88% 86%,rgba(255,255,255,.98),rgba(244,244,232,.92) 34%,rgba(210,210,195,.84) 58%,rgba(135,135,122,.22) 75%,transparent 77%),
    linear-gradient(315deg,rgba(255,255,255,.96),rgba(226,226,210,.84) 52%,rgba(140,140,126,.18) 65%,transparent 67%);
  filter:drop-shadow(0 12px 14px rgba(0,0,0,.42));
  border-radius:0 0 0 18px;
  will-change:opacity,transform;
}
#book[data-dir="1"] #fold-curl{
  right:0;
  clip-path:polygon(100% 100%,100% 0,0 100%);
  clip-path:path("M 86 86 L 86 8 C 76 36 48 70 0 86 Z");
  transform-origin:100% 100%;
}
#book[data-dir="-1"] #fold-curl{
  left:0;
  clip-path:polygon(0 100%,100% 100%,0 0);
  clip-path:path("M 0 86 L 0 8 C 10 36 38 70 86 86 Z");
  transform-origin:0 100%;
}
#book[data-dir="-1"] #fold-curl{background:
    radial-gradient(ellipse 125% 78% at 12% 86%,rgba(255,255,255,.98),rgba(244,244,232,.92) 34%,rgba(210,210,195,.84) 58%,rgba(135,135,122,.22) 75%,transparent 77%),
    linear-gradient(45deg,rgba(255,255,255,.96),rgba(226,226,210,.84) 52%,rgba(140,140,126,.18) 65%,transparent 67%);
  border-radius:0 0 18px 0;
}

#curve-sheet{
  position:absolute;inset:0;z-index:12;display:none;
  transform-style:preserve-3d;
  pointer-events:none;
}
.curl-slice{
  position:absolute;top:0;bottom:0;
  transform-style:preserve-3d;
  will-change:transform,filter;
}
.curl-face{
  position:absolute;inset:0;
  overflow:hidden;
  backface-visibility:hidden;
  background-repeat:no-repeat;
  background-color:#fff;
  box-shadow:none;
}
.curl-back{transform:rotateY(180deg);}
.curl-gloss{
  position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(90deg,rgba(255,255,255,.28),transparent 38%,rgba(0,0,0,.16));
  mix-blend-mode:multiply;
  opacity:.28;
  backface-visibility:hidden;
}
.curl-edge{
  position:absolute;top:0;bottom:0;width:7px;right:-4px;
  background:linear-gradient(to right,rgba(255,255,255,.75),rgba(205,205,190,.8),rgba(0,0,0,.18));
  transform:translateZ(2px);
  opacity:0;
  pointer-events:none;
}

/* BOTTOM CONTROLS */
#ctrl{
  position:fixed;bottom:0;left:0;right:0;height:46px;
  display:flex;align-items:center;justify-content:center;gap:14px;
  background:rgba(255,255,255,.5);
  backdrop-filter:blur(8px);
  border-top:1px solid rgba(160,130,80,.2);
  z-index:100;
}
.cbtn{
  background:rgba(160,130,80,.08);
  border:1px solid rgba(160,130,80,.45);
  color:var(--gold-text);
  padding:5px 18px;border-radius:18px;
  font-size:12px;cursor:pointer;
  letter-spacing:.1em;font-family:inherit;
  transition:background .2s,border-color .2s;
}
.cbtn:hover:not(:disabled){background:rgba(160,130,80,.16);border-color:var(--gold-text);}
.cbtn:disabled{opacity:.28;cursor:default;}
.dlbtn{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;}
#pg{color:rgba(60,50,35,.5);font-size:11px;letter-spacing:.18em;min-width:80px;text-align:center;}
#dots{display:flex;gap:4px;align-items:center;max-width:280px;flex-wrap:wrap;justify-content:center;}
.dot{
  width:5px;height:5px;border-radius:50%;
  background:rgba(80,68,50,.22);
  cursor:pointer;flex-shrink:0;
  transition:background .25s,transform .25s;
}
.dot.on{background:var(--gold);transform:scale(1.6);}
#zoom-controls{
  position:fixed;
  right:12px;
  bottom:58px;
  z-index:110;
  display:none;
  gap:6px;
}
.zbtn{
  width:34px;
  height:34px;
  border-radius:50%;
  border:1px solid rgba(160,130,80,.45);
  background:rgba(255,255,255,.72);
  color:var(--gold-text);
  font-size:15px;
  font-family:inherit;
  cursor:pointer;
  box-shadow:0 6px 14px rgba(80,68,50,.16);
}
html.single-page-mode #zoom-controls{display:flex;}
html:not(.zoomed) #zoom-out,
html:not(.zoomed) #zoom-reset{opacity:.38;}
#mobile-turn{
  position:absolute;
  inset:0;
  z-index:90;
  pointer-events:none;
  perspective:1400px;
  display:none;
}
#mobile-turn.play{display:block;}
.mt-base,
.mt-sheet,
.mt-face{
  position:absolute;
  inset:0;
  overflow:hidden;
  border-radius:3px;
  background:#fff;
}
.mt-base img,
.mt-face img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
.mt-base{
  z-index:1;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.045);
}
.mt-sheet{
  z-index:2;
  transform-style:preserve-3d;
  will-change:transform;
  box-shadow:0 12px 22px rgba(0,0,0,.28);
}
.mt-face{
  backface-visibility:hidden;
  transform-style:preserve-3d;
}
.mt-back{transform:rotateY(180deg);}
#mobile-turn.prev .mt-back{
  transform:none;
  backface-visibility:visible;
  background:
    linear-gradient(90deg,rgba(255,255,255,.96),#fff 55%,rgba(226,226,218,.96)),
    #fff;
}
#mobile-turn.prev .mt-front{
  animation:mobilePrevFront .82s linear forwards;
}
.mt-sheet::after{
  content:'';
  position:absolute;
  inset:0;
  z-index:5;
  pointer-events:none;
  background:
    linear-gradient(90deg,rgba(255,255,255,.38),transparent 35%,rgba(0,0,0,.22)),
    radial-gradient(ellipse 26% 100% at 0 50%,rgba(0,0,0,.18),transparent 70%);
  opacity:.72;
  backface-visibility:hidden;
}
#mobile-turn.next .mt-sheet{
  transform-origin:right center;
  animation:mobileNextFlip .72s cubic-bezier(.25,.7,.2,1) forwards;
}
#mobile-turn.prev .mt-sheet{
  transform-origin:left center;
  animation:mobilePrevFlip .82s cubic-bezier(.42,0,.28,1) forwards;
}
@keyframes mobileNextFlip{
  0%{transform:rotateY(0deg) translateZ(1px);}
  45%{filter:brightness(.96);}
  100%{transform:rotateY(-180deg) translateZ(1px);filter:brightness(.9);}
}
@keyframes mobilePrevFlip{
  0%{
    transform:translateX(-100%) rotateY(-180deg) translateZ(1px);
    filter:brightness(.8);
  }
  100%{
    transform:translateX(0) rotateY(0deg) translateZ(1px);
    filter:brightness(1);
  }
}
@keyframes mobilePrevFront{
  0%,8%{opacity:1;}
  14%,100%{opacity:0;}
}
@media (max-width:700px){
  #ctrl{gap:7px;padding:0 7px;}
  .cbtn{padding:5px 10px;font-size:11px;letter-spacing:.04em;}
  #pg{min-width:54px;font-size:11px;}
  #dots{max-width:118px;gap:4px;}
}

/* PageFlip engine */
#book.pageflip-mode{
  display:block!important;
  transform:none!important;
  filter:
    drop-shadow(0 28px 30px rgba(0,0,0,.58))
    drop-shadow(0 8px 10px rgba(0,0,0,.28));
  overflow:visible!important;
}
#book.pageflip-mode::before{
  content:'';
  position:absolute;left:10px;right:10px;bottom:-15px;height:20px;
  z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(to bottom,rgba(250,250,238,.9) 0 1px,rgba(165,165,148,.58) 1px 2px,rgba(236,236,222,.65) 2px 4px),
    linear-gradient(to bottom,rgba(255,255,255,.25),rgba(0,0,0,.28));
  border-radius:0 0 4px 4px;
  transform:skewX(-.8deg);
  box-shadow:0 14px 18px rgba(0,0,0,.34);
  opacity:.92;
}
#book.pageflip-mode::after{
  content:'';
  position:absolute;right:-14px;top:9px;bottom:-10px;width:18px;
  z-index:0;pointer-events:none;
  background:
    repeating-linear-gradient(to right,rgba(250,250,238,.98) 0 2px,rgba(170,170,150,.68) 2px 3px,rgba(232,232,218,.94) 3px 5px),
    linear-gradient(to right,rgba(255,255,255,.86),rgba(0,0,0,.24));
  border-radius:0 4px 4px 0;
  box-shadow:9px 10px 18px rgba(0,0,0,.4);
  transform:skewY(.8deg);
  opacity:.94;
}
#book.pageflip-mode .pf-page{
  width:100%;
  height:100%;
  background:#fff;
  overflow:hidden;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.045);
}
#book.pageflip-mode .pf-page img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
  pointer-events:none;
}
#book.pageflip-mode .pf-page::after{
  content:'';
  position:absolute;inset:0;
  pointer-events:none;
  background:
    linear-gradient(to right,rgba(0,0,0,.1),transparent 13%,transparent 86%,rgba(0,0,0,.07)),
    radial-gradient(ellipse 22% 100% at 0 50%,rgba(0,0,0,.12),transparent 68%),
    radial-gradient(ellipse 22% 100% at 100% 50%,rgba(0,0,0,.09),transparent 68%);
  opacity:.62;
}
#book.pageflip-mode .stf__item.--hard,
#book.pageflip-mode .stf__item.--soft-cover{
  box-shadow:none!important;
}
#book.pageflip-mode .stf__item.--hard .pf-page::before,
#book.pageflip-mode .stf__item.--soft-cover .pf-page::before{
  content:'';
  position:absolute;inset:0;
  pointer-events:none;
  z-index:3;
  background:
    linear-gradient(110deg,rgba(255,255,255,.18),transparent 32%),
    radial-gradient(ellipse 70% 18% at 95% 98%,rgba(0,0,0,.18),transparent 72%);
  opacity:.55;
}
.stf__wrapper{transition:filter .18s ease;}
.stf__wrapper{
  overflow:visible!important;
  position:relative!important;
  width:100%!important;
  height:100%!important;
  box-sizing:border-box;
  z-index:2;
}
.stf__wrapper:hover{filter:brightness(1.015);}
.stf__block{overflow:visible!important;}
.stf__block::after{
  content:'';
  position:absolute;top:-1px;bottom:-1px;left:50%;width:66px;
  transform:translateX(-50%);
  z-index:50;pointer-events:none;
  background:
    radial-gradient(ellipse 66% 100% at 50% 50%,rgba(0,0,0,.36),rgba(0,0,0,.18) 34%,transparent 72%),
    linear-gradient(to right,transparent,rgba(255,255,255,.1) 45%,rgba(0,0,0,.28) 53%,transparent);
  filter:blur(2.1px);
  opacity:.9;
}
html.single-page-mode .stf__block::after{
  content:none!important;
  display:none!important;
}
.stf__block::before{
  content:'';
  position:absolute;inset:-10px -16px -30px -16px;
  z-index:-1;pointer-events:none;
  background:
    radial-gradient(ellipse 48% 14% at 50% 98%,rgba(60,50,35,.28),rgba(60,50,35,.1) 56%,transparent 76%);
  filter:blur(12px);
  opacity:.8;
}
#book.fallback-mode{
  display:flex;
  transform:none!important;
  overflow:visible!important;
  filter:
    drop-shadow(0 28px 30px rgba(0,0,0,.58))
    drop-shadow(0 8px 10px rgba(0,0,0,.28));
}
#book.fallback-mode .fallback-page{
  position:relative;
  overflow:hidden;
  background:#fff;
  box-shadow:inset 0 0 0 1px rgba(0,0,0,.045);
}
#book.fallback-mode .fallback-page img{
  display:block;
  width:100%;
  height:100%;
  object-fit:cover;
}
#book.fallback-mode .fallback-page::after{
  content:'';
  position:absolute;inset:0;
  pointer-events:none;
  background:
    linear-gradient(to right,rgba(0,0,0,.12),transparent 16%,transparent 84%,rgba(0,0,0,.08)),
    radial-gradient(ellipse 22% 100% at 0 50%,rgba(0,0,0,.14),transparent 68%),
    radial-gradient(ellipse 22% 100% at 100% 50%,rgba(0,0,0,.1),transparent 68%);
  opacity:.65;
}

/* ===== FIX 1: Cover & back cover — clean full-bleed, no frame ===== */
#book.pageflip-mode .stf__item.--hard .pf-page,
#book.pageflip-mode .stf__item.--soft-cover .pf-page{
  box-shadow:none!important;
}
#book.pageflip-mode .stf__item.--hard .pf-page::after,
#book.pageflip-mode .stf__item.--soft-cover .pf-page::after,
#book.pageflip-mode .stf__item.--hard .pf-page::before,
#book.pageflip-mode .stf__item.--soft-cover .pf-page::before{
  content:none!important;
  display:none!important;
}
/* When resting on the cover or the back cover, remove ALL book-edge /
   paper-stack / spine decorations so the single page is perfectly clean.
   (.at-cover / .at-back are toggled from JS by page index.) */
#book.pageflip-mode.at-cover::before,
#book.pageflip-mode.at-cover::after,
#book.pageflip-mode.at-back::before,
#book.pageflip-mode.at-back::after{
  content:none!important;
  display:none!important;
}
#book.pageflip-mode.at-cover .stf__block::before,
#book.pageflip-mode.at-cover .stf__block::after,
#book.pageflip-mode.at-back .stf__block::before,
#book.pageflip-mode.at-back .stf__block::after{

  display:none!important;
}
#book.pageflip-mode.at-cover .stf__outerShadow,
#book.pageflip-mode.at-cover .stf__innerShadow,
#book.pageflip-mode.at-cover .stf__hardShadow,
#book.pageflip-mode.at-cover .stf__hardInnerShadow,
#book.pageflip-mode.at-back .stf__outerShadow,
#book.pageflip-mode.at-back .stf__innerShadow,
#book.pageflip-mode.at-back .stf__hardShadow,
#book.pageflip-mode.at-back .stf__hardInnerShadow{

/* ===== FIX 2: Solid paper backing so a turning page never shows the
   page underneath (does NOT change the flip mechanism) ===== */
#book.pageflip-mode .stf__item{background:#fff!important;}
#book.pageflip-mode .pf-page{background:#fff!important;}

<script>
/* -- Data -- */
const IMGS = window.PCJ_IMGS || [];
const VIEWS = [{left:null,right:0},{left:1,right:2},{left:3,right:4},{left:5,right:6},{left:7,right:8},{left:9,right:10},{left:11,right:12},{left:13,right:14},{left:15,right:16},{left:17,right:18},{left:19,right:20},{left:21,right:22},{left:23,right:24},{left:25,right:26},{left:27,right:28},{left:29,right:30},{left:31,right:32},{left:33,right:34},{left:35,right:null}];
const VN = VIEWS.length;

const scene = document.getElementById('scene');
const zoomWrap = document.getElementById('zoom-wrap');
const mobileTurn = document.getElementById('mobile-turn');
const book = document.getElementById('book');
const bookShad = document.getElementById('book-shadow');
let pageFlip = null;
let currentPage = 0;
let fallbackMode = false;
const BOOK_PAGES = IMGS;
let PW = 0, PH = 0;
let singlePageMode = false;
let zoomScale = 1;
let zoomX = 0;
let zoomY = 0;
let pinchStartDistance = 0;
let pinchStartScale = 1;
let panStartX = 0;
let panStartY = 0;
let panBaseX = 0;
let panBaseY = 0;
let lastTapAt = 0;
let swipeStartX = 0;
let swipeStartY = 0;
let swipeActive = false;
let mobileTurnBusy = false;

function clamp(n, min, max) {
  return Math.max(min, Math.min(max, n));
}

function clampZoomPan() {
  if (zoomScale <= 1) {
    zoomX = 0;
    zoomY = 0;
    return;
  }
  const maxX = (window.innerWidth * (zoomScale - 1)) / 2 + 60;
  const maxY = (window.innerHeight * (zoomScale - 1)) / 2 + 60;
  zoomX = clamp(zoomX, -maxX, maxX);
  zoomY = clamp(zoomY, -maxY, maxY);
}

function applyZoom() {
  clampZoomPan();
  document.documentElement.classList.toggle('zoomed', singlePageMode && zoomScale > 1.01);
  zoomWrap.style.transform = `translate3d(${zoomX}px, ${zoomY}px, 0) scale(${zoomScale})`;
}

function setZoom(scale) {
  if (!singlePageMode) scale = 1;
  zoomScale = clamp(scale, 1, 3);
  if (zoomScale <= 1.01) zoomScale = 1;
  applyZoom();
}

function adjustZoom(delta) {
  setZoom(zoomScale + delta);
}

function resetZoom() {
  zoomScale = 1;
  zoomX = 0;
  zoomY = 0;
  applyZoom();
}

function touchDistance(a, b) {
  return Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY);
}

function setupMobileZoom() {
  scene.addEventListener('touchstart', e => {
    if (!singlePageMode) return;
    if (e.touches.length === 2) {
      pinchStartDistance = touchDistance(e.touches[0], e.touches[1]);
      pinchStartScale = zoomScale;
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    if (e.touches.length === 1 && zoomScale > 1) {
      panStartX = e.touches[0].clientX;
      panStartY = e.touches[0].clientY;
      panBaseX = zoomX;
      panBaseY = zoomY;
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    if (e.touches.length === 1) {
      swipeStartX = e.touches[0].clientX;
      swipeStartY = e.touches[0].clientY;
      swipeActive = true;
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }, { passive: false, capture: true });

  scene.addEventListener('touchmove', e => {
    if (!singlePageMode) return;
    if (e.touches.length === 2 && pinchStartDistance > 0) {
      setZoom(pinchStartScale * (touchDistance(e.touches[0], e.touches[1]) / pinchStartDistance));
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    if (e.touches.length === 1 && zoomScale > 1) {
      zoomX = panBaseX + (e.touches[0].clientX - panStartX);
      zoomY = panBaseY + (e.touches[0].clientY - panStartY);
      applyZoom();
      e.preventDefault();
      e.stopImmediatePropagation();
      return;
    }
    if (e.touches.length === 1 && swipeActive) {
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }, { passive: false, capture: true });

  scene.addEventListener('touchend', e => {
    if (!singlePageMode) return;
    if (e.touches.length < 2) pinchStartDistance = 0;
    if (e.touches.length === 0) {
      let didSwipe = false;
      const touch = e.changedTouches && e.changedTouches[0];
      if (touch && swipeActive && zoomScale <= 1) {
        const dx = touch.clientX - swipeStartX;
        const dy = touch.clientY - swipeStartY;
        if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.25) {
          didSwipe = true;
          go(dx < 0 ? 1 : -1);
        }
      }
      swipeActive = false;
      const now = Date.now();
      if (!didSwipe && now - lastTapAt < 280) setZoom(zoomScale > 1 ? 1 : 2);
      lastTapAt = didSwipe ? 0 : now;
    }
    if (zoomScale > 1 || pinchStartDistance > 0) {
      e.preventDefault();
      e.stopImmediatePropagation();
    }
  }, { passive: false, capture: true });
}

function mobilePrevFlip() {
  if (mobileTurnBusy || !pageFlip || currentPage <= 0) return;
  mobileTurnBusy = true;
  const fromPage = currentPage;
  const targetPage = currentPage - 1;
  mobileTurn.className = 'prev';
  mobileTurn.innerHTML = `
    <div class="mt-base"><img src="${IMGS[targetPage]}" alt=""></div>
    <div class="mt-sheet">
      <div class="mt-face mt-front"><img src="${IMGS[fromPage]}" alt=""></div>
      <div class="mt-face mt-back"></div>
    </div>
  `;
  mobileTurn.offsetHeight;
  mobileTurn.classList.add('play');
  window.setTimeout(() => {
    if (pageFlip.turnToPage) pageFlip.turnToPage(targetPage);
    updateUIFromPage(targetPage);
    mobileTurn.className = '';
    mobileTurn.innerHTML = '';
    mobileTurnBusy = false;
  }, 860);
}

function getPageFlipCtor() {
  return window.PageFlip || (window.St && window.St.PageFlip);
}

function viewIndexFromPage(pageIndex) {
  if (pageIndex <= 0) return 0;
  return Math.min(VN - 1, Math.ceil(pageIndex / 2));
}

function firstPageForView(viewIndex) {
  if (viewIndex <= 0) return 0;
  if (viewIndex >= VN - 1) return IMGS.length - 1;
  return viewIndex * 2 - 1;
}

function updateUIFromPage(pageIndex) {
  currentPage = Math.max(0, Math.min(BOOK_PAGES.length - 1, pageIndex || 0));
  const viewIndex = viewIndexFromPage(currentPage);
  book.classList.toggle('at-cover', viewIndex <= 0);
  book.classList.toggle('at-back', viewIndex >= VN - 1);
  const v = VIEWS[viewIndex];
  const pgs = singlePageMode ? [currentPage + 1] : [v.left, v.right].filter(x => x !== null).map(x => x + 1);
  document.getElementById('hdr-r').textContent =
    pgs.length === 1 ? 'p.' + pgs[0] : 'p.' + pgs[0] + ' – p.' + pgs[1];
  document.getElementById('pg').textContent =
    singlePageMode
      ? (currentPage + 1) + ' / ' + BOOK_PAGES.length
      : viewIndex === 0 ? '表紙' : viewIndex === VN - 1 ? '裏表紙' : viewIndex + ' / ' + (VN - 2);
  document.getElementById('btn-p').disabled = currentPage <= 0;
  document.getElementById('btn-n').disabled = currentPage >= BOOK_PAGES.length - 1;
  document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === viewIndex));
}

function showSafeFallback(pageIndex = currentPage) {
  fallbackMode = true;
  currentPage = Math.max(0, Math.min(BOOK_PAGES.length - 1, pageIndex || 0));
  sizeBook();
  book.className = 'fallback-mode';
  book.innerHTML = '';
  book.style.width = (PW * (singlePageMode ? 1 : 2)) + 'px';
  book.style.height = PH + 'px';

  const viewIndex = viewIndexFromPage(currentPage);
  const v = VIEWS[viewIndex];
  const fallbackPages = singlePageMode ? [currentPage] : [v.left, v.right];
  fallbackPages.forEach((pageNo, side) => {
    const page = document.createElement('div');
    page.className = 'fallback-page';
    page.style.width = PW + 'px';
    page.style.height = PH + 'px';
    page.style.borderRadius = singlePageMode ? '3px' : side === 0 ? '3px 0 0 3px' : '0 3px 3px 0';
    if (pageNo !== null) {
      const img = document.createElement('img');
      img.src = IMGS[pageNo];
      img.alt = 'page ' + (pageNo + 1);
      page.appendChild(img);
    }
    book.appendChild(page);
  });
  updateUIFromPage(currentPage);
}

function buildPages() {
  book.innerHTML = '';
  book.className = 'pageflip-mode';
  BOOK_PAGES.forEach((src, i) => {
    const page = document.createElement('div');
    page.className = 'pf-page';
    const img = document.createElement('img');
    img.src = src;
    img.alt = 'page ' + (i + 1);
    page.appendChild(img);
    book.appendChild(page);
  });
}

function sizeBook() {
  const wasSinglePageMode = singlePageMode;
  singlePageMode = window.innerWidth <= 700;
  document.documentElement.classList.toggle('single-page-mode', singlePageMode);
  if (!singlePageMode || wasSinglePageMode !== singlePageMode) resetZoom();
  const sw = window.innerWidth - (singlePageMode ? 28 : 52);
  const sh = window.innerHeight - 38 - 46 - 38;
  const ratio = 595.5 / 842.25;
  let h = sh, w = h * ratio;
  const pagesAcross = singlePageMode ? 1 : 2;
  if (w * pagesAcross > sw) { w = sw / pagesAcross; h = w / ratio; }
  PW = w; PH = h;
  book.style.width = (PW * pagesAcross) + 'px';
  book.style.height = PH + 'px';
  bookShad.style.width = (PW * pagesAcross + 18) + 'px';
  bookShad.style.height = PH + 'px';
}

function initPageFlip(pageToOpen = currentPage) {
  const Ctor = getPageFlipCtor();
  if (!Ctor) {
    showSafeFallback(pageToOpen);
    return;
  }

  if (pageFlip && pageFlip.destroy) {
    try { pageFlip.destroy(); } catch (_) {}
    if (!book.isConnected) document.getElementById('scene').appendChild(book);
  }

  sizeBook();
  buildPages();

  pageFlip = new Ctor(book, {
    width: Math.round(PW),
    height: Math.round(PH),
    size: 'stretch',
    minWidth: Math.max(260, Math.round(PW * .72)),
    maxWidth: Math.round(PW),
    minHeight: Math.max(360, Math.round(PH * .72)),
    maxHeight: Math.round(PH),
    showCover: true,
    drawShadow: true,
    maxShadowOpacity: .66,
    flippingTime: 820,
    usePortrait: singlePageMode,
    startPage: Math.max(0, Math.min(BOOK_PAGES.length - 1, pageToOpen)),
    autoSize: false,
    showPageCorners: true,
    clickEventForward: true,
    useMouseEvents: true,
    mobileScrollSupport: false
  });

  pageFlip.loadFromHTML(book.querySelectorAll('.pf-page'));
  softenCoverVisuals();
  pageFlip.on('flip', e => {
    updateUIFromPage(e.data);
    requestAnimationFrame(softenCoverVisuals);
  });
  // Corner-drag flips: while a fold/flip is in progress next to an edge, keep the
  // cover/back decorations hidden so the striped edge never flashes at the top.
  pageFlip.on('changeState', e => {
    if (e.data === 'read') return;
    const vi = viewIndexFromPage(currentPage);
    if (vi <= 1) book.classList.add('at-cover');
    if (vi >= VN - 2) book.classList.add('at-back');
  });
  updateUIFromPage(pageToOpen);
}

function softenCoverVisuals() {
  book.querySelectorAll('.stf__item.--hard').forEach(item => item.classList.add('--soft-cover'));
}

function go(dir) {
  if (mobileTurnBusy) return;
  if (fallbackMode) {
    resetZoom();
    jump(viewIndexFromPage(currentPage) + (dir > 0 ? 1 : -1));
    return;
  }
  if (!pageFlip) return;
  resetZoom();
  // Pre-apply the edge class so cover/back decorations stay hidden during the flip too.
  const tv = viewIndexFromPage(currentPage) + (dir > 0 ? 1 : -1);
  if (tv <= 0) book.classList.add('at-cover');
  if (tv >= VN - 1) book.classList.add('at-back');
  if (singlePageMode && pageFlip.flip) {
    if (dir > 0) pageFlip.flipNext('top');
    else pageFlip.flipPrev('top');
    return;
  }
  if (dir > 0) pageFlip.flipNext('top');
  else pageFlip.flipPrev('top');
}

function jump(viewIndex) {
  resetZoom();
  viewIndex = Math.max(0, Math.min(VN - 1, viewIndex));
  const pageIndex = firstPageForView(viewIndex);
  if (fallbackMode) {
    showSafeFallback(pageIndex);
    return;
  }
  if (!pageFlip) return;
  if (viewIndex <= 0) book.classList.add('at-cover');
  if (viewIndex >= VN - 1) book.classList.add('at-back');
  if (pageFlip.turnToPage) pageFlip.turnToPage(pageIndex);
  updateUIFromPage(pageIndex);
}

(function createDots() {
  const dc = document.getElementById('dots');
  VIEWS.forEach((_, i) => {
    const d = document.createElement('div');
    d.className = 'dot';
    d.onclick = () => jump(i);
    dc.appendChild(d);
  });
})();

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') go(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') go(-1);
});

let resizeTimer = null;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => initPageFlip(currentPage), 180);
});

window.addEventListener('error', e => {
  if (!fallbackMode) showSafeFallback(currentPage);
});

try {
  setupMobileZoom();
  initPageFlip(0);
} catch (err) {
  showSafeFallback(0);
}
</script>
